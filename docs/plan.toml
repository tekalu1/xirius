[[item]]
id = "UI-339"
title = "時間のグリッドの線を 4 段（小節・拍・分割・細かい）の GridLine に作り直し、拍子・3 連・テンポの変化に合わせ、両方のルーラーに拍と 16 分の番号を出す"
area = "UI"
phase = "mvp"
source = "grid/report.md § 3 ; grid/report.md § 5"
after = ["UI-121", "UI-123", "MIX-038"]
done_when = "時間のグリッドの線は xirius_design の GridLine だけが幅と色を出す（小節 2 px、ほかは 1 px、色は line_grid_bar・beat・sub・fine）。どの面（地・hover・選択・黒鍵の行）でも両方のテーマで 小節 > 拍 > 分割 > 細かい の比になる。小節線と拍線は 6 px 以上離れていればいつも出て、間引かない。分割と細かい線はスナップの値まで、8 px 以上離れたときだけ出て、詰まる手前は薄くなる。線とスナップは小節の頭から数える。6/8・9/8・12/8 の拍は付点 4 分で、ルーラーの番号は 8 分で数える。「小節」のスナップはその小節の長さ、フレームのスナップと線はテンポの地図から出す。スナップは選んだ値のままで、見えている一番細かい線がスナップより粗いときだけ、グリッドのボタンに「表示 1/16」のように添える。自動の候補はメニューの値（1/64 音符〜1/4）だけで、8 px 以上の一番細かい値を選び、ボタンは「自動 1/16」と書く。アレンジを最も寄せても線が消えず、1/64 音符の間隔が 256 px 以上になると、秒の 1・2・5 の線とルーラーの時刻を出す（拡大の上限は変えない）。アレンジとピアノロールのルーラーは、拍が 52 px 以上で拍の番号、16 分が 52 px 以上で 16 分の番号を出す。3 連のグリッドでは分割が 3 つ割りになり、ルーラーは拍の番号だけにして、拍の 1/3 に分割の目盛りを置く。ボタンの表示・自動の値・秒の線・3 連のルーラーは、窓を開かない単体試験で数える。design lint が GridLine を通さないグリッドの色の塗りと細い線を止める"
status = "done"

