title = "保存の手応えと失敗を印と警告の札で示し、別名で保存と書き終わり待ちを画面の外で行う"
area = "UI"
phase = "v1"
source = "mockups/daw-plan.html § 機能のマトリクス/新規（2026-10-18 保存中の表示の承認）"
done_when = "Ctrl+S と曲のメニューの保存で印が450 ms以上保存中になり、200 msを超える保存・閉じる・別の曲を開く書き終わり待ちに幕を出す。別名で保存は別スレッドでコピーし、すぐ細い線、200 ms後に幕とバイト数の割合の棒を出し、Escと中止で途中のフォルダーを消して元の曲を保つ。幕の間はスペースだけ受ける。保存・自動保存・履歴の失敗はErrorKind別の理由の札と保存できませんの印に集約し、札を閉じても成功するまで印を保つ。実窓の押す経路と遅い書き込みの試験で確かめる"
status = "done"

[[item]]
id = "UI-289"
title = "画面で開いている曲がほかのアプリ（コマンドライン・MCP）で保存されたら気付いて知らせ、1 つの編集として読み込む"
area = "UI"
phase = "v1"
source = "mockups/daw-plan.html § 機能のマトリクス/新規（2026-10-18 ほかのアプリの変更の承認、案 B）"
done_when = "画面は開いている曲のproject.jsonをOSの通知（受けられない所は2秒ごとの更新時刻）で見張り、自分の保存（中身が画面の書いた物と同じ）には反応せず、続けて書かれたら最後から300 ms待って1回だけ扱う。未保存の変更が無ければすぐ読み込み、レーンの左下に「ほかのアプリの変更を読み込みました」と「元に戻す」を4秒出す。未保存の変更があれば「ほかのアプリで曲が変更されました」と「読み込む」「×」を押すまで出し、×の後もまた変わればまた聞く。読み込みは履歴の1段「ほかのアプリの変更」で、Ctrl+Zと元に戻すで前に戻り、再生は止まらず、音源の準備のカードは出ない。ドラッグ・録音・名前の入力・保存の幕の間は終わるまで待つ。別のプロセスでxiriusを動かす実窓の押す経路の試験で確かめる"
status = "done"

[[item]]
id = "ENG-064"
title = "曲を開いたら音源とエフェクトをすべて開いてから編集できるようにし、その間は「音源を準備中 n/N」を出す。開き直す場面では光った鍵の中にスピナーを出す"
area = "ENG"
phase = "v1"
source = "reports/06-editing-feel.md"
done_when = "装置を開く窓で曲を開くと、カードに「音源を準備中 n/N」・進みのバー・トラックごとの済み／準備中／待ちが出て、同じプロセスのプラグインは 1 フレームに 1 つ、別プロセスのプラグインはまとめて開き（プラグインごとのプロセスなら同時に開く）、すべて開くとカードが閉じて装置が開く。開けないプラグインは代わりの音源の警告を出して曲は開く。「後で読む」と Esc でカードを閉じると残りは要ったときにその場で開く。--silent・撮影・試験の窓は装置を開かない。開き直す場面では押して 150 ms 鳴らない鍵にスピナーが出て、準備ができた時に押したままなら鳴り、離した後には鳴らず、8 秒で諦める。各プラグインの開いた時間が Builder::timings とログに残る（xirius-session の eng064_starting・eng064_apart、xirius-ui の prepare_card_tests）"
status = "done"

[[item]]
id = "ENG-065"
title = "「後で読む」の後・差し替え・プラグインのプロセスが落ちた後の開き直しで、窓を止めずに音源を開き、開けた音源から鳴らす"
area = "ENG"
phase = "v1"
source = "reports/06-editing-feel.md"
done_when = "別プロセスのプラグインが遅く開く曲で、「後で読む」の後の最初の鍵・再生・ロールの試し弾きでも、音源やエフェクトの差し替え・plugin.isolation.set・プラグインのプロセスが落ちた後の開き直しでも、窓のフレームの間隔が止まらない（開く返事を待たない）。開けた音源から鳴り始め、開く前に押した鍵は押したままなら開いた時から鳴り、離した後には鳴らない。差し替えの間もほかのトラックの再生は止まらず、開き直すトラックの光った鍵にスピナーが出て（カードは出さない）、鳴り始めると消え、8 秒で諦める。開けないプラグインは代わりの音源の警告を出す。同じプロセスのプラグインは 1 フレームに 1 つのまま（xirius-session の eng065_late・eng065_swap、xirius-ui の open_later_tests）"
status = "done"

[[item]]
id = "PRJ-024"
title = "曲を開いたまま持つ MCP のサーバーも、画面（ほかのプロセス）の保存を次のコマンドの前に 1 段で取り込んでから続ける"
area = "PRJ"
phase = "v1"
source = "mockups/daw-plan.html § 機能のマトリクス/新規（2026-10-18 UI-289 の残り、MCP も取り込むと決めた）"
done_when = "MCP のサーバーは各コマンドの前に、CLI が曲を開くときと同じ決まりで project.json を見る。保存していない段が無く、最後に読み書きした後にほかのプロセスが保存していたら、そのファイルを 1 段（project.reload、ほかのアプリの変更）として取り込んでから実行し、読むだけのコマンドも取り込んだ後の曲を答え、結果の events に project.reload を載せる。自分の保存の後は段を増やさない。MCP の history.undo で取り込みが戻る。保存していない段があるときは取り込まず、AI の保存は取り込んだ後のファイルのハッシュと比べて上書きを断る（AI-018）。画面が保存した後の最初の history.undo が取り込んだ保存を戻すことを、CLI と MCP について docs/command-protocol.md に書く（xirius-mcp の other_save）"
status = "done"

[[item]]
id = "ENG-066"
title = "新しいミックスが音源を開いている間（保留中）に、鳴っている音源へ入れた値を失わない"
area = "ENG"
phase = "v1"
source = "reports/06-editing-feel.md"
done_when = "別プロセスのプラグインが遅く開き、差し替えが保留中の間に、鳴っている古い音源の窓で動かした値・曲から与えた値（パラメーター・状態・オートメーション）は古い音源に届いて聞こえる。保留を取り消したら古い音源にその値が残り、入れ替わったら新しい音源がその値で鳴る。窓と音源からの報告は、古い音源を閉じるまで古い音源のもの（xirius-session の eng066_pending）"
status = "done"

[[item]]
id = "ENG-067"
title = "差し替えの保留中に新しい音源が開けなくても、鳴っている古い音源の失敗・開いた返事・遅れを書き換えない"
area = "ENG"
phase = "v1"
source = "reports/06-editing-feel.md"
done_when = "PluginLink は、失敗・開いた返事・遅れ（ミックスに足すフレームと組んだ時のプラグインの遅れ）・開くのにかかった時間を、鳴っている音源の席と新しい組が開いた音源の席に分けて持つ。別プロセスのプラグインが遅く開く曲で、差し替えの保留中に新しい音源が開けなくても、古い音源の error・opened・遅れ・状態の報告は変わらず、古い音源は鳴り続け、組み直しも起きない。保留を取り消すと新しい音源の席は消え、入れ替わった時に差し替えの警告（「読み込めません（バイパスして再生します）」）を出す。古い音源から届く状態は、鳴っている音源のものだけを曲への編集として受け、入れ替わった後に古い窓を閉じた時の取り直しは新しい音源の状態を書き換えない（xirius-session の eng067_seats・eng067_recapture）"
status = "done"

[[item]]
id = "PRJ-025"
title = "MCP のサーバーがコマンドの前に project.json を見るとき、大きさと更新時刻が変わっていなければハッシュを取らない"
area = "PRJ"
phase = "v1"
source = "mockups/daw-plan.html § 機能のマトリクス/新規（2026-10-18 PRJ-024 の残り、コマンドごとのハッシュを前置きで省く）"
done_when = "曲のセッションは project.json を見るとき、先に大きさと更新時刻を読み、最後に同じファイルと確かめた時のものと同じならファイルを読まずハッシュも取らない。違えばハッシュを取り、最後に読み書きしたファイルのハッシュと比べる（同じ中身なら取り込まない）。大きさと更新時刻は、書かれてから 2 秒（FAT の時刻の刻み）より後に読んだものだけを覚え、同じ大きさ・同じ時刻で書き換えられたファイルも取り込む。MCP のコマンドの前置きで、変わっていない間はハッシュを数える口が増えず、大きさの違う保存・同じ大きさの保存・同じ大きさと時刻の保存を取り込む。数十 MB の project.json で、変わっていないときの前置きの時間を測る（xirius-mcp の prj025_stamp）"
status = "done"

[[item]]
id = "ENG-068"
title = "窓で動かした値でプラグインの遅れが変わったとき、同じフレームで編集を曲へ取り込んでも、遅れに合わせた組み直しを捨てない"
area = "ENG"
phase = "v1"
source = "reports/06-editing-feel.md"
done_when = "返事を待たない形（画面のプレイヤー）で、別プロセスのプラグインの窓で値を動かし遅れが変わると、遅れに合わせた新しい組の差し替えが始まる。同じフレームで窓の編集を曲へ取り込む（collect_plugin_states が待つ形の sync を呼ぶ）ときも、その sync が組み直さなければ差し替えは残り、値の変わった曲から組み直す。曲のための差し替えを取り消す時（曲が鳴っている組と同じに戻った時）も、待っている間に遅れが変わっていれば、遅れのための差し替えとして続ける。差し替えが終わると、鳴っている組の遅れはプラグインが報告した遅れになる（xirius-session の eng068_latency_edit。直す前は遅れが元のままで落ちる）"
status = "done"

[[item]]
id = "ENG-069"
title = "別プロセスのプラグインを今の値から開き直すとき、窓で動かした値を、最初に開いた時の値に戻さない"
area = "ENG"
phase = "v1"
source = "reports/06-editing-feel.md"
done_when = "別プロセスのプラグインの窓で値を動かすと、サーバーが覚えている「その音源をもう一度開く時の値」（PluginServer::current）にもその値が入る。曲が先に別の値を持っていた（開いた時の値と違う）プラグインで、窓で値を動かして遅れが変わり、同じフレームで窓の編集を曲へ取り込んだとき、遅れに合わせた新しい組の音源は、窓で動かした値で開き、鳴っている組の遅れもその値のものになる（xirius-session の eng068_latency_edit。直す前は新しい音源が開いた時の値に戻り、遅れも元のままで落ちる）"
status = "done"

[[item]]
id = "ENG-070"
title = "窓を開いたままプラグインの分け方を変え別のホストへ移るとき、窓は新しい組が入った時に新しいホストの音源で開き直す"
area = "ENG"
phase = "v1"
source = "reports/06-editing-feel.md"
done_when = "別プロセスのプラグインの窓を開いたまま分け方（plugin.isolation.set）を変え、別のホストのプロセスへ移る差し替えを返事を待たない形で進めるとき、待つ間は古い窓が開いたままで、状態（plugin_statuses の editor_open）も開いたままと言う。新しい組が入った時（promote）に、新しいホストの新しい音源で窓が開く（xirius-session の eng070_window_moves。直す前は、新しい音源の窓が開かず、画面は閉じた窓として扱って消していた。plugins.rs の印を外すと待つ間の editor_open で、promote で開く所を外すと新しいホストに窓が無いことで落ちる）。画面（xirius-ui の --script plugin-swap）でも、前面を取らない実際の窓で、遅れが変わる・トラックを足す・共有のホストへ移すの各段で、窓が新しい音源へ移り、窓で動かした値が残る（xirius-ui の plugin_swap_window）"
status = "done"

[[item]]
id = "ENG-071"
title = "窓を開いたままプラグインを同じプロセスと別のプロセスの間で移すとき、窓は新しい組が入った時に新しい場所で開き直し、待つ間に閉じた窓は開き直さない"
area = "ENG"
phase = "v1"
source = "reports/06-editing-feel.md"
done_when = "プラグインの窓を開いたまま分け方（plugin.isolation.set）を「なし」と別のプロセスの間で変え、差し替えを返事を待たない形で進めるとき、待つ間は鳴っている古い音源が窓・状態の報告（reports と plugin_statuses の遅れ・editor_open）・値の動きを持ち、新しい組が入った時に新しい場所（アプリのプロセス・新しいホスト）で窓が開き直す。待つ間に古い窓を閉じたら（画面から・ホストでの人の操作で）、移り先の窓が開いている印も消え、組が入っても開き直さない。差し替えを捨てたら古い音源がそのまま鳴り、窓も開いたまま（xirius-session の eng071_place_moves。直す前は、待つ間の状態の報告が消え、このプロセスへ移った窓は開き直さず、待つ間に閉じた窓は新しいホストで開いていた）。人が古いホストの窓を閉じたのが組の入る直前で、ホストの「閉じた」が組の入った後に届いても、窓は新しいホストでもアプリのプロセスでも開き直さない（同じ試験。直す前は、外した後のスロットへの知らせとして捨て、5 回とも閉じたことが数えられなかった）。同じプロセスの音源を 1 つの Builder で何度も書き出しても、最初の回の音源を残さない（xirius-session の eng071_offline_renders）。画面（xirius-ui の --script plugin-swap）でも、前面を取らない実際の窓で、このプロセスへ移す・自分のホストへ戻す段で窓が新しい場所で開き直し、共有のホストへ・このプロセスへ移す組を待つ間に閉じた窓は開き直さない（xirius-ui の plugin_swap_window。窓が開いたことと古いホストが手放したことはホストの返事で見て、時間では待たない）。XIRIUS_SWAP_VST3 に実機の VST3 を渡すと同じ場面をその音源で回し、窓が開き直るまでの時間を出す。窓で動かした値は、動きと状態が画面の別々の回に届いても曲の値に入り（xirius-session の plugins::tests。直す前は同じ回に届いたときだけ入り、plugin_swap_window が main でも 5 回中 2 回落ちた）、plugin_swap_window を単独で 10 回流して落ちない"
status = "done"

[[item]]
id = "EDT-140"
title = "クリップのフェードを繰り返し変更でき、再生音にも反映する"
area = "EDT"
phase = "v1"
source = "mockups/daw-plan.html § 機能のマトリクス/編集"
done_when = "Link の入切に関わらず、フェードイン・アウトの旗を繰り返し延長・短縮・解除でき、カーブも再変更できる。ドラッグは各 1 履歴となり、取り消しで元へ戻る。鳴っているエンジンはフェードの長さ・カーブ・解除・取り消し・やり直しを受け取り、書き出しと同じ音になる。変更のないトラックは再構築しない"
status = "done"

[[item]]
id = "UI-290"
title = "xirius-ui.exe を Windows の GUI 型（subsystem windows）にし、ダブルクリックで黒いコンソールの窓を開かない。端末から起動したときは親の端末に付けて --help・--version・--list・使い方の誤りを読めるようにする"
area = "UI"
phase = "v1"
source = "1.0-msi-checks.md § UI-290（1.0 の配布、Windows Terminal へのコンソールの引き渡しが壊れた PC での確認）"
done_when = "xirius-ui.exe の PE ヘッダーの Subsystem が WINDOWS_GUI（2）で、通常の窓の指定（Start-Process -WindowStyle Normal）で起動すると窓が出る。標準出力・標準エラーがパイプやファイルのときはそのまま使い、向き先が無いときだけ AttachConsole(ATTACH_PARENT_PROCESS) で親の端末の CONOUT$ に付ける（console.rs）。--help・--version を足し、パイプへの --help・--version・--bench --list・引数の誤り（終了コード 2）が読める（tests/gui_subsystem.rs）"
status = "done"

[[item]]
id = "PLG-060"
title = "プラグインの全件再スキャンで、スキャン用の子が起動できない・大半が失敗したときに、一覧のキャッシュを上書きして空にしない"
area = "PLG"
phase = "v1"
source = "1.0-msi-checks.md § PLG-060（CLI の plugin.rescan --full で 442 件すべて失敗し、キャッシュが 0 件になった実機の確認）"
done_when = "xirius.exe 自身が __scan-plugin の子になり（他のファイルを隣に要らない）、スキャン用プログラムの探し方は XIRIUS_PLUGIN_SCAN・自身（CLI・画面が起動時に指定）・隣の xirius-plugin-scan・xirius・xirius-ui の順。子がすべて起動できない、または 8 件以上開いて半数超が失敗したときは、キャッシュを書かずに理由 1 行の Err を返す（tests/scan.rs、xirius-cli の tests/cli.rs）。実機の release の CLI で plugin.rescan --full が 441 バンドル・680 件・失敗 12 件（タイムアウト）になる"
status = "done"

[[item]]
id = "UI-291"
title = "設定の窓を開いている間も、窓の UIA の子要素に設定の部品（節・スイッチ・選択肢・ドロップダウン・欄・ボタン、オーディオの入力の行）を出す"
area = "UI"
phase = "v1"
source = "1.0-msi-checks.md § UI-291（UI-026・UI-080 の実機の確認。設定の MIDI のページで UIA の子要素が 0 件）"
done_when = "設定を開いている間、窓は Dialog「設定」で、節は Tab（選択状態つき）、スイッチは Switch（オン・オフつき）、選択肢は RadioButton、ドロップダウンは ComboBox（値つき）、数・文字の欄は TextInput、ボタンは Button として、行の見出しを名前にして出る（a11y.rs の settings_nodes と単体試験。tests/uia_window.rs は MIDI のページも読む）。実際の release の窓（Start-Process -WindowStyle Normal）で、設定を開く前は Tree「トラック」、MIDI を開いた間は Window「設定」の子（TabItem・「PC のキーボード」の切り替え・「MIDI 入力オフセット」の欄）、閉じた後は Tree「トラック」に戻り、オーディオでは入力の行が選択状態つきの RadioButton として出る"
status = "done"

[[item]]
id = "UI-292"
title = "ピアノロールの矢印の既定を基本にし、拡張のときはノートの上下の端の当たりをカーソルと帯で示す"
area = "UI"
phase = "v1"
source = "reports/06-editing-feel.md § 1.9"
done_when = "設定 edit.arrow.mode の既定が basic で、値が無ければロールは基本、extended を保存した人は拡張のまま（xirius-prefs の KEY-020 の試験・edit_tests）。拡張のとき、ノートの上の端ではカーソルが上下の矢印、下の端でははさみになり、その端に ring の色の 4 px の帯が重なる。基本のとき・押している間・ノートの中ほどでは帯が出ない（roll/tests.rs の単体試験）。docs/ui-approved.md に 2026-10-21 の承認の形がある"
status = "done"

[[item]]
id = "UI-293"
title = "左のレールのボタンの説明を、ボタンごとの名前とそのタブを開くキーにする"
area = "UI"
phase = "v1"
source = "mockups/asis/rail-tip.png"
done_when = "レールの 4 つのボタンの説明が「音源  F6」「エフェクト  F7」「ファイル  F9」「曲のファイル」で、「ブラウザーを表示」を出さない。キーはキー割り当てから引く（hover_tip.rs の単体試験）"
status = "done"

[[item]]
id = "UI-294"
title = "再生位置の縦の線のまわりのぼかしの影を無くす"
