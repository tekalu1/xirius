done_when = "1 px が 128 フレームより細かい所は、見えている範囲だけ元の音（xirius-session::samples が別のスレッドで 65,536 フレームずつ読む）から描き、1 px が 1 サンプルより細かい所は線で結び、サンプルが 4 px 以上離れたら点も打つ。読み終わるまではピークで描き、届いたら描き替える（フレームを止めない）。時間の拡大の上限は 1 サンプル 6 px（曲の一番遅いテンポとサンプルレートから決め、4,096 px/拍を下限にする。120 BPM・48 kHz で 144,000 px/拍）。トラック列の上の角のズームのボタンの後ろに縦の拡大のボタン（×1→×2→×4→×1、吹き出しは「波形の縦の拡大 ×N」、コマンドは view.zoom.wave）があり、Alt＋ホイールでも 1 段ずつ変わる。縦の拡大は見た目だけで曲に保存しない。波形はクリップのゲイン・ゲインの線・フェードを掛けた形で描き、ドラッグ中もその形で描く。描く点の計算（細かさの段・上限・点の位置・逆再生・列の範囲・高さ）を窓を出さない単体試験で確かめ、`--script wave-zoom` が並ぶ"
status = "done"

[[item]]
id = "UI-311"
title = "MIDI クリップのトランスポーズを、クリップに持つ絶対の値（±24 半音）にする（ノートは書き換えず、鳴らすときに足す）"
area = "UI"
phase = "v1"
source = "ux-wave-transpose-inspector-report.md § 2"
done_when = "MIDI クリップは `transpose`（±24 半音、値の無い古い曲は 0、範囲の外は読みで丸める）を持ち、右クリックメニューの頭の欄はオーディオのクリップと同じ値の欄（↑↓ で 1・Shift で 12・打った値は Enter、単位の文字は横に置かず、読み上げだけ「トランスポーズ +2 半音」のように単位を付ける）でクリップの今の値を出し、0 でないときは名前の右に「+2」の印を出す（オーディオの印と同じ形で、負は「−」）。「トランスポーズをノートに書き込む」は値をノートに足して 0 に戻し、値が 0 のときは押せず、1 回の取り消しでノートと値が戻る。再生・書き出し・バウンス・フリーズ・ピアノロールの試聴・MIDI ファイルの書き出しは値を足した高さで鳴らし（0〜127 の外のノートは鳴らさない）、ピアノロールは書いたままの高さで描く。複製・分割・貼り付け・結合でも値を引き継ぎ、DAWproject は書き出しのときにノートへ足す。オーディオのクリップのメニューからも「半音」「BPM」「セント」の文字を消し、速さは値に % を含める。値を読む・書く入口は `clip.transpose`（`--semis`／`--by`、オーディオと MIDI の両方）と `clip.transpose.write` の 2 つにまとめる。モデル・コマンド・取り消し・保存して読み直す・古い曲・複製と分割・鳴る高さ・ノートへの書き込みを窓を出さない試験で確かめる"
status = "done"

[[item]]
id = "UI-312"
title = "インスペクターをレールのプールの下に足し、トラックのトランスポーズ（±64 半音）とベロシティ（±100%）を持たせる"
area = "UI"
phase = "v1"
source = "ux-wave-transpose-inspector-report.md § 3"
done_when = "レールのプールの下に丸の中の i（`inspector`）のボタンがあり、押すか F4 でブラウザーと同じ場所・幅の面が開閉し、ほかのレールの面とはどれか 1 つだけが開く（ツールチップは「インスペクター  F4」）。インスペクターは、選んだトラックの色・アイコン・名前と、インストゥルメントトラックだけトランスポーズ（±64 半音）・ベロシティ（±100%）を、選んだクリップがあればその名前と欄（MIDI はトランスポーズ、オーディオはトランスポーズ・微調整・速さを右クリックのメニューと同じ部品で、速さは小数のまま渡す）を出し、トラックやクリップを押すと中身が替わる（何も選んでいないときは面を空のまま出し、案内の文は置かない）。欄はクリップのメニューと同じ動き（↑↓・Shift・ホイール・入力・Enter）で、横に単位を描かず、読み上げだけ「トランスポーズ +2 半音」「ベロシティ +10%」のように単位を付ける。欄の対象は行番号ではなくトラック・クリップの ID と欄の種類で持ち、対象が変わったとき・面の外を押したとき・別の欄を打ち始めたときは打ちかけを捨てて打つ状態を抜け、F4・Space・Ctrl+Z のような修飾付きのキーや全体の操作のキーは欄で取らずに本来の操作へ渡す（受け付けない文字は表示中の値を消さない）。トラックは `transpose`・`velocity` を持ち（古い曲は serde の default で 0、範囲の外は読みで丸める、0 は保存の形を変えない、複製で写す）、画面のノートは動かさず、再生・書き出し・バウンス・フリーズ・MIDI ファイルの書き出し・ピアノロールの試聴・弾いた鍵盤（PC-50 と PC のキーボード）でクリップのトランスポーズと足し合わせ、足した高さが 0〜127 の外のノートは鳴らさず、ベロシティは 1〜127 に丸める（録音中のモニターも同じ丸めにする）。録音する MIDI は弾いたままの高さと強さで書き、録音中のモニターは録音を始めたときの値に固定せず、途中で値が変われば Thru へ届け、押している音は始めたときに送った高さで止めてから新しい値に替える。トラックの値が 0 でないときは頭の名前の右に 1 つの印を出し、名前の場所は実測が全角 3 文字ぶん（約 42px）より短ければその実測ぶん、長ければ 3 文字ぶんを取って入りきらない所を「…」で切り（「…」だけにはしない）、印は残りに収まる形を長い順（全部の形「−12 +10%」→ 1 つだけの形 → 値があることだけを示す小さな点）に選び、印の描く所・当たりの判定・名前を打つ欄は同じ矩形を使って、どの形でも指を載せると「トランスポーズ −12・ベロシティ +10%」と 2 つの値を全部出す。入口は `track.transpose`（`--semis`）と `track.velocity`（`--percent`）で、schema に範囲を出し、範囲の外は丸め、1 回の取り消しで戻り、docs/commands.md に載る。行を広げるボタンの名前は「トラックを広げる」。DAWproject は書き出しのときにノートの高さと強さへ掛ける。モデル・コマンド・取り消し・保存して読み直す・古い曲・複製・鳴る高さとベロシティ（無音の出力）・弾いた鍵盤・インスペクターの開閉と中身の切り替えを窓を出さない試験で確かめ、`--script inspector` が並ぶ"
status = "done"

[[item]]
id = "UI-313"
title = "クリップのメニューのトランスポーズの欄を IME・ホイールで変えられるようにし、インスペクターのクリップの区画を選ばれているときだけ出し、「トランスポーズをノートに反映」をノートの処理へ移す"
area = "UI"
phase = "v1"
source = "investigate-14-clip-field.md § 1〜4"
done_when = "右クリックのメニューを開くとトランスポーズの欄（それが無ければ最初の値の欄）がキーを持ち、キャレットと縁がその欄に出る。札を押しても欄にキーが移り、検索の箱を押すとキーは検索へ移る。数字・符号・↑↓は欄が受け、ひらがな・英字は検索の箱へ渡る（名前で探せる）。Esc は、何も打っていなければメニューを閉じ、打ちかけなら捨てる。IME の組み立て中は Enter・Backspace・↑↓・Esc を欄で取らず IME に任せる。IME の組み立て中の字は検索の箱の marked に入れず欄が持ち、欄が 1 字でも受けたら検索の箱の marked を消す。`Typing::put` は全角の `０-９`・`＋`・`－`（U+FF0D）・`ー`・`．` を半角として受け、`field_text` は 1 字でも受けたときだけ true を返す（受けない字は検索の箱へ渡す）。インスペクターの欄・下のバーのテンポも全角の数字を受ける。値の欄は `context/fields.rs` の溜め（1 ノッチ 60 px、逆へ回したら溜めを捨てる）でホイールに従い、奥へ回すと増え、1 ノッチは `Kind::step(false)`、Shift は `Kind::step(true)`（Windows は dx で来る。Shift の dx の 1 イベントは 1 ノッチ）、Ctrl は小数の欄（テンポ・速さ）だけ 0.1（整数の欄は 1 のまま）。インスペクターの欄と右クリックのメニューの欄の両方が同じ部品を使い、メニューでは指の下が欄の値のセルなら一覧を流さず値を変え、札の上とほかの行では流し、一覧を流したホイールの続き（最後のイベントから 400 ms 以内）は欄の上でも流し続ける。回して変えたらその欄にキーが移り、続けて回した分（同じ欄・400 ms 以内）の取り消しは `Session::begin_group`／`end_group` で 1 つにまとまる。下のバーのテンポのホイールは Shift で 10、Ctrl で 0.1（前は Shift で 0.1）。インスペクターのクリップの区画は `arrange.clips` がちょうど 1 つで、それが `selected_clip` と同じときだけ出し、トラックの頭を押したとき（アレンジの選択を外し、ピアノロールのクリップは残す）と空いたレーンを押したときは出さず、クリップを押すと出る。見出しは今のアイコン＋クリップ名のまま。MIDI クリップの「トランスポーズをノートに反映」（旧「トランスポーズをノートに書き込む」）は欄のすぐ下ではなく「クオンタイズ」の中に置き、コマンドパレットからも使え、押すと値をノートに足して 0 に戻し、1 回の取り消しで戻る。窓を出さない試験で、全角の `５` の組み立てと確定のあと Enter で 5 になること・検索の marked が空になること・メニューを開いてすぐ 3 と Enter で 3 になること・「く」で検索の箱に入ること・60 px で +1・20 px 3 回で +1・逆で溜めを捨てる・Shift で +12・Ctrl で +0.1・メニューの欄の上で一覧が動かないこと・トラックの頭と空いたレーンの後にクリップの区画が無いこと・クリップを押すと出ることを確かめ、`--script feel` の f07a がメニューを開いた直後のキャレットを撮り、`--script inspector` の in04 がトラックだけの姿を撮る"
status = "done"

