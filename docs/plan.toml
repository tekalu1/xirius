done_when = "使えるプロセッサーに空きが無い間、子が自分のコードを走らせ始めたと知らせる前（親が作った名前付きのイベントを子が立てる）、子が全プロセスの一覧に見えない間（作られている途中・終わりかけ）、子のスレッドがメモリ・ページ・カーネルの中の錠（WrPushLock・WrPageIn・WrResource ほか）を待っている間は、プロセッサーを待つときと同じく子が使ったプロセッサーの時間だけを数え、自分の何か（イベント・眠り・メッセージ・返事）を待つときは経った時間を数える（spawn の単体の試験）。眠り続ける子と空回りし続ける子は、自分のコードを始めてから制限時間のほどで時間切れになる（試験はそこから測る）。空回り 24 本と、ファイルとプロセスを作り続ける 2 本を並べた中で、spawn の a_scan_process_kept_waiting_for_a_processor_is_not_timed_out と a_scan_process_that_waits_on_nothing_still_runs_out_of_time が、負荷の試験で 1 回も落ちない（2026-10-16、別の PC（22 論理コア）で働く子 154/154・155/155、空回りの子 314/314。働く子が取り分より多くプロセッサーを得て制限時間の内に終わった回は、場面が作れていないので回し直す）"
status = "done"

