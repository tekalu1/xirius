[[item]]
id = "REC-026"
title = "閉じる曲の録音の片付けを軽くし、曲を開く道から外す"
area = "REC"
phase = "v1.1"
source = "hang-open-song.md § 2 ; hang-open-song.md § 5 A"
done_when = "project.cleanup は、録音のフォルダー（Recordings）が無い曲、または中に wav が 1 つも無い曲では、履歴・blob・版・project.json を 1 つも読まずに 0 を返す。移す候補があるときも、状態は blob を解かず（読まず・SHA-256 もせず）にクリップのパスだけを集め、versions/index.json は 1 回だけ読む。画面で別の曲を開く・新しい曲・サンプル・DAWproject の読み込みで曲を差し替えるとき、閉じた曲の片付けは新しい曲を開いた後に裏のスレッドで走り、UI のスレッドを止めない。結果は今と同じ通知（notice::cleaned・エラー）で、終わったときに出る。片付けの最中に同じ曲を開き直すときは、片付けを止めてすぐ開き、脇へ移していた録音は元へ戻す。裏の片付けは、録音を 1 つずつ、このプロセスで開いている曲（undo・redo で戻せる状態も）がそのファイル（別の書き方のパスも）を使っていないことを確かめてから脇（.xirius-moving）へ移し、閉じた曲がどこでも開かれていないこと・ほかのプロセスが曲に書き足していないこと・その間にコマンドがファイルを曲に置いていないことを確かめてからごみ箱へ移す（使われていたら元へ戻す）。置き場に触る処理（ロックのファイル・名前の変更・ごみ箱）の間はコマンドを止めず、コマンドが片付けを待つのはメモリの上の確かめの間だけにする（長いコマンドの後ろに片付けが並んでいても、次のコマンドは 50 ms までしか待たない）。窓を閉じるときは、残っている片付けを 10 秒まで待ち、終わらないものは止めて、次に起動したときに続ける。脇へ移す・元へ戻すときはファイルを上書きしない（その間に同じ名前で録られたテイクがあれば、戻すファイルを「名前 (2).wav」として戻す。録音の名前は脇にある名前を避ける）。脇はプロセスごとのフォルダー（.xirius-moving/<プロセス>/）に分け、プロセスはファイルを置いている間そのフォルダーのロック（held.lock）を持つ。ほかのプロセスが脇に置いたものは、そのプロセスが落ちているときだけ元へ戻し、一覧（片付けの窓・dry run）では何も動かさない。ごみ箱から戻されたもの（held.lock の無いフォルダーにあるもの）は元の場所へ戻し、その回はごみ箱へ移さない。試験で、戻す先に新しいテイクがあっても上書きしないこと、脇にある名前でテイクを録っても両方が残ること、ほかのプロセスが脇に置いたものを一覧でも片付けでも動かさないこと、録音が無い曲では履歴のファイルを 1 つも開かないこと（読んだファイルの数）、録音がある曲・undo で戻せる録音は動かさないこと、別の曲を開いている間に片付けが走って使われていない録音だけを移すこと、その間に次の曲が置いた録音は移さないこと、4 つの差し替えの道のどれでも片付けが裏で走ること、1 ファイルを移すのに 2 秒かかる置き場で片付けが動いている間も次の曲の編集が 1 秒より短く返ることを確かめる"
status = "done"

[[item]]
id = "PRJ-028"
status = "done"
title = "キャンセル可能な曲の読み込みと Session の受け渡し"
area = "PRJ"
phase = "v1.1"
source = "hang-open-song.md § 5 B ; hang-open-song.md § 5 C ; hang-open-song.md § 5 D"
after = ["REC-026"]
done_when = "通常曲・同一曲・版の読込と Session 作成・writer 待ち・候補と旧 Session の破棄が worker で行われ、読込数と現在名を通知し、中止・失敗時に元の履歴と lane を保って返せることを I/O ゲートとスレッド計測で確かめる"
note = "全入口の非同期化と中止 UI は PRJ-029。画面はこの段では変えない。既存のファイル・最近・起動・版を別曲として開く入口は Song::open_on_worker の完了を同期で待つ橋渡しを使う。独立 CLI/MCP と core の project.open は同期を維持する。新規・サンプル・DAWproject・画面コマンド/接続 MCP の統一は PRJ-029、旧 player/出力の退役と音の準備は PRJ-030、付随 I/O と画面全体の応答の保証は PRJ-031 に残す。返却 guard は worker 側の切断でも Session と lane を返し、回収不能な表示用 Session は保存先を外して直接の履歴移動も含む編集・保存・autosave を拒否する。進行通知から独立した I/O 計測で Song/Studio の入口を検査し、実書き込みを止めた pending writer の完了前に候補 I/O が無いこと、実際の tidy の I/O と開き直しの重なりをチャンネル同期で検証する。版は保存先の親の非公開で一意な作業フォルダーに完成させ、採用時に上書き禁止の rename 1 回で公開する。既存の保存先は空でも拒否する。同一ボリュームでの rename ができない場合や未対応の置き場は失敗とし、コピーで代替しない。中止・失敗時に worker が削除するのは非公開の作業フォルダーだけで、公開済みの保存先・他者のファイル・共有ロックは削除しない。Windows の開いたファイルによる rename 拒否を避けて候補を閉じてから公開し、公開後は lane を取り直して再読する。この再読が失敗しても公開済みの曲は残し、旧 Session を返す。"

[[item]]
id = "PRJ-029"
title = "全入口の非同期読み込みと中止 UI を揃える"
area = "PRJ"
phase = "v1.1"
source = "hang-open-song.md § 5 B ; hang-open-song.md § 5 C ; hang-open-song.md § 5 D"
after = ["PRJ-028"]
done_when = "ファイル・最近・新規・サンプル・DAWproject・起動・画面コマンドと接続 MCP が同じ要求窓口を使い、200 ms 後の Block の件数/現在名・Esc/中止・閉じる確認・古い結果の無効化が働き、独立 CLI の同期完了と UI 台本の非同期待ちを回帰試験で確かめる"
status = "partial"
remaining = "このプロセス内の VST3 の getState が、曲を開く前処理の collect_plugin_states で UI 所有スレッドから同期実行される。所有スレッドと状態取得の仕組みの見直しを PRJ-030 で行う。また、下書きの初回登録・別名保存後などの recent 更新は UI から同期実行し、プロセス間ロックを待つ。履歴更新を持ち主の worker へ集める対応は PRJ-031 に残す。"
note = "2026-10-24 承認: 案 B の 360×160、親パスから省略してファイル名を残す。件数・名前は通常 250 ms、動きを減らすとき 1 秒、読み上げは 5 秒。ロック待ち・保存待ちにも件数を併記し、中止中は件数・名前を固定。中止は即受理し旧 Session 返却まで「中止しています」。前曲は要求時に停止して成功まで保持し、中止後も停止。別曲は拒否。閉じる・終了は既存確認部品で「中止して閉じますか」。DAWproject も Block・中止・旧曲保持を共用。2026-10-25 の利用者の指示: 不可逆な採用への返事を送る前に「開いています」へ移り、中止を出さない。中止を出している間の操作は旧 Session を返せる中止として受理する。ロック待ち・保存待ちの 0 件は省く。コマンドの version.open は現在の曲を保ってコピーを作り、履歴画面の切り替え操作と区別する。承認 token の一回性・期限・結果照会と、CLI・接続 MCP の応答を保つ。採用中の閉じる・終了の確認は「閉じますか」「戻る」「閉じる」とし、中止を約束しない。公開は閉じた後にも完了し得る。この閉じ方では最後に画面へ採用済みの曲を次回起動先として記録し、作成されたコピーは残す。"

[[item]]
id = "PRJ-030"
title = "全トラックの音を裏で準備し編集と両立させる"
area = "PRJ"
phase = "v1.1"
source = "hang-open-song.md § 5 B ; hang-open-song.md § 5 C ; hang-open-song.md § 5 D"
after = ["PRJ-029"]
done_when = "プラグインの無い音声曲も含め units 単位で素材 decode/変換/prime/プラグイン/graph を worker で準備し、Line と進行トースト/詳細カードで示し、編集・保存・次曲へ移れて、未準備の再生/REC/書出しは開始せず通知し、revision 違いの結果と RT 上の I/O/確保/ロック/破棄を採用しないことを試験で確かめる"
note = "2026-10-24 決定: 普段は Line と進行トースト、詳細だけ既存カード。「後で読む」は詳細を閉じるだけで裏の準備は続く。docs/ui-approved.md の ENG-064（全部開いてから編集・必要時にその場で開く・裏読みを採らない）と食い違うため、同文書は PRJ-030 の実装時にモック承認と合わせて更新する。型のスレッド制約と出力所有者を先に点検する。PRJ-029 に残る、このプロセス内の VST3 の getState も対象。所有スレッドの制約を保って状態取得を非同期にし、取得を止めても UI が中止と閉じるに応答することを検証する。単純な別スレッドへの移動は行わない。"

