[[item]]
id = "ARC-037"
title = "プラグインのスキャンの 1 つの束の時間切れは、Windows では子のプロセスが使えた時間で数える。混んだ PC でプロセッサーを待たされた健全なプラグインを、応答の無いものと見なさない"
area = "ARC"
phase = "v1"
source = "mockups/rev4-spec.md § 確かめ方"
done_when = "スキャンの子が使えるプロセッサーに空きが無く、子がプロセッサーを待っている間は子が使ったプロセッサーの時間だけを数え、それ以外（空きがある・子が眠っている・何かを待っている）は経った時間を数える。spawn の単体の試験で、8 本の空回りとプロセッサーを分け合って 1 秒の上限より長くかかった子は時間切れにならず、眠り続ける子と空回りし続ける子は時間切れになる。試験と負荷を 1 コアに寄せて空回りを 24 本並べた中で、xirius-ui の tests/scan.rs は直す前 10 回のうち 0 回しか通らず（kHs Gain が時間切れで読み込めないとされる）、直した後は 10 回とも通る"
status = "done"

[[item]]
id = "ARC-038"
title = "プラグインのスキャンで、起動の途中で終わった子（0xC0000142）は新しい隠しデスクトップで 1 回だけ起動し直し、隠しデスクトップはスキャンごとに別の名前にする。混んだ PC で子が起動できなかっただけの健全なプラグインを、壊れたものと見なさない"
area = "ARC"
phase = "v1"
source = "mockups/rev4-spec.md § 確かめ方"
done_when = "隠しデスクトップはスキャンごとに別の名前になる（spawn の単体の試験）。終了コード 0xC0000142 で終わった子は新しい隠しデスクトップで 1 回だけ起動し直し、2 回目の結果を記録する（spawn の単体の試験で、1 回目だけ 0xC0000142 で終わる子は 0 で終わったと返る）。直す前の版は負荷の中の 228 回のうち 1 回、1 つのスキャンの 4 つの子がすべて 0xC0000142 で終わり、kHs Gain まで読み込めないとされた。直した後の版は同じ条件で 146 回とも通る"
status = "done"

