[[item]]
id = "PRJ-027"
status = "partial"
remaining = "PRJ-029 のローカル VST3 の状態取得（PRJ-030 で所有スレッドから見直す）、PRJ-030 の音の準備と player/出力の退役、BRW-019 を前提とする PRJ-031 の付随 I/O と画面全体の応答保証が残る"
title = "曲を開く重い処理を UI のスレッドから外し、開いている間は進み具合と取り消しを見せる"
area = "PRJ"
phase = "v1.1"
source = "hang-open-song.md § 5 B ; hang-open-song.md § 5 C ; hang-open-song.md § 5 D"
after = ["REC-026", "PRJ-031"]
note = "PRJ-028〜PRJ-031 の総括。読み込み開始時に旧曲を停止し、失敗・中止後も停止したまま保持する。中止は即受理し、旧 Session 返却まで中止中とする。読み込み中の別曲要求は拒否、準備中は受理。DAWproject も Block・中止・旧曲保持に統一。未準備の再生・REC・書き出しは通知して開始せず、完了後に再操作する。ブラウザーと波形は BRW-019、画面全体の応答保証は PRJ-031。"
done_when = "曲を開くとき、project.open のファイルの読み込み（index・状態・project.json・blob を読み、確かめ、lock を取る）と Session の作成を裏のスレッドでし、出来たら UI のスレッドで差し替える（DAWproject の読み込み dawproject_ui.rs の形: 裏で読み、mpsc で返し、Arc<AtomicU64> で進み具合を渡し、フレームごとに受け取る）。読んでいる間は wait::Kind::Block の幕（200 ms 後。読んだファイルの数と今読んでいるファイル名）を出し、Esc か「中止」で裏の Session を捨てて元の曲に戻る。窓を動かす・大きさを変える・最小化はでき、元の曲の編集・再生・ほかの曲を開く・保存はできない。窓を閉じるときは「中止して閉じますか」と聞く。開いた後の再生の準備（wav の読み込みと変換）は、プラグインの無い曲でも prepare_card.rs のカード（Progress::units・「後で読む」）の単位でトラックごとに裏で進め、その間は wait::Kind::Line と進み具合のトーストを出す。準備の間も新しい曲を見る・編集する・保存する・ほかの曲を開く（準備を止める）はでき、再生・録音・書き出しは「音を準備しています」と出して待つ。1 ファイルに数秒かかる置き場を試験で作り、開く・準備の間も窓が「応答なし」にならないことを確かめる"

[[item]]
id = "BRW-019"
status = "done"
title = "ブラウザーの一覧と波形の元の確かめを、UI のスレッドでファイルを開かずにする"
area = "BRW"
phase = "v1.1"
source = "hang-open-song.md § 2 ; hang-open-song.md § 5 E"
done_when = "ブラウザーの一覧（browser_files.rs の read_dir と項目ごとの種類の判定）を裏のスレッドで読み、種類は DirEntry::file_type から取る。1 秒（FRESH）ごとの読み直しも描画のたびに UI のスレッドでしない。波形の look（wave.rs）の元の wav の is_file と peaks::load も、Peaks を作る裏のスレッド（peaks::request と同じ道）に寄せる。1 ファイルに数秒かかる置き場のフォルダーを開いたまま・その上の素材のクリップを描いても、描画が止まらないことを試験で確かめる"
note = "一覧の列挙・種類判定・更新と、波形の元ファイル確認・保存済みピーク読込を worker に統一。更新中は直前の一覧を保ち、フォルダー移動時に受信口を捨てて旧結果を破棄する。PRJ の I/O 観測を再利用し、列挙・種類判定・元確認・ピーク読込をゲートで止めたまま一覧レイアウトとクリップ描画用の参照が戻ること、UI と異なるスレッドであること、FRESH 更新の重複抑止と移動後の旧結果破棄を時間に依存せず検証する。"

[[item]]
id = "BRW-020"
title = "ブラウザーの試聴の読み込みと再生の準備を UI のスレッドから外し、押したらすぐに始める"
area = "BRW"
phase = "v1.1"
source = "browse-preview/report.md § 4 A ; browse-preview/report.md § 4 C"
after = ["BRW-007"]
done_when = "ファイルの行を押すと、250 ms の見回りを待たずに試聴のスレッドへ渡り、UI のスレッドはファイルを開かない。ファイルは 1 回だけ開いて長さ・音・Peaks を作る。試聴の再生器は押すたびに作り直さない。1 個の読み込みに数秒かかる置き場でも窓が止まらず、待っている間に別のファイルを押すと新しい方が先に鳴る"
status = "done"
notes = "決め事: 試聴は開いたままの小さな再生器を持つ。BRW-019 と重なる試聴の行の波形（wave::look の is_file・peaks::load）はここで試聴のスレッドへ移し、ブラウザーの一覧の read_dir と、試聴の外の wave::look は BRW-019 に残す。排他モードの試聴は、曲のエンジンの出力に固定容量の音声キューで混ぜる（方式 b）。停止中の楽器の試奏と入力監視を保ち、曲の再生開始で機器を開き直さないため。曲の再生・録音開始では試聴を止め、表示も停止に戻す。出力を捨てるときは試聴を無効にし、共有出力の解放を裏で確認してから排他出力を開く。共有モードの独立した試聴の機器は 30 秒鳴らなければ閉じる"

[[item]]
id = "BRW-021"
title = "試聴で解いた音を、大きさの上限つきで覚え、同じファイルの 2 回目をすぐに鳴らす"
