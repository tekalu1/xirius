[[item]]
id = "UI-320"
title = "一覧を検索付きの共通の部品（PickList）で作り、ほかの作り方をできなくする"
area = "UI"
phase = "v1.1"
source = "presets-v3/report.md § 9 ; v3-y-report.md § 3"
done_when = "xirius-ui に一覧の部品 PickList を 1 つ置き、一覧のメニューを作る API はそれだけにする。頭に検索の欄（開くとフォーカスが入る）があり、名前で大文字・小文字を区別せず絞り込み、当たりの無い組見出しは隠し、↑↓ で選んで Enter で決め、Esc はまず語を消してもう一度で閉じ、当たりが無いと行を隠して「一致する…はありません」（UIA の status）を出す。検索の欄は一覧の外にあり、一覧を描き直しても入力とフォーカスが残る。高さは 480 と画面の端までで縮み、欄の下だけスクロールする。一覧の下の操作の段（プリセットの保存など）は絞り込みに掛からない。＋の追加の一覧（インサート・インストゥルメント）、インストゥルメントのメニュー、ストリップの入力・出力の行き先をこの部品に移し、後から足す一覧（プリセット・サイドチェーンの送り元・スプリッターのモード・X/Y パッドの軸）もこの部品で作る。一覧を開く試験で検索の欄・↑↓ Enter・Esc の 2 段・当たり無しの表示を数え、docs/design-rules.md の表に「一覧系は検索付きの共通部品（PickList）で作る | 一覧を作る API は PickList だけ | 一覧を開く試験で検索の欄・↑↓ Enter・Esc の 2 段を数える | —」の 1 行を足す"
status = "done"

