status = "partial"
notes = "決め事: 上限は合計 256 MB・1 個 64 MB で、設定には出さない。音と Peaks の Vec の確保容量を数える。キャッシュ命中は stat を待たずに鳴らし、鮮度は裏で確かめ、古ければ止めて読み直す。50 ms は未達の可能性が残るため partial とする（出力が 48 kHz 以外では命中時にも変換が走る）。"
remaining = "キャッシュ命中から最初の発音まで 50 ms 以内の保証と、48 kHz 以外の出力での変換の再利用。stat の待ちは発音を止めないことをゲートで確かめる。"

[[item]]
id = "BRW-022"
title = "試聴で選んだファイルの前後を先に読み、一覧の長さのために全部の wav を開かない"
area = "BRW"
phase = "v1.1"
source = "browse-preview/report.md § 4 D"
