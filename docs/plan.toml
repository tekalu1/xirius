done_when = "ファイルを選ぶと、上下の数個を裏で読んで試聴のキャッシュに入れ、↓ で次に送ったときに開く時間を待たない。一覧の長さは見えている行の近くだけを読み、遅い置き場ではファイルの大きさから見積もって後で直す"
status = "done"
notes = "決め事: 先に読むのは選んだ行の下の 3 行と上の 1 行。開くのに 300 ms を超えた置き場では、長さをファイルの大きさから見積もり、見えている行だけを正しく測る。見積もりの率は同じフォルダーの同じ形式で測れた物を使い、圧縮の形式は測れるまで見積もらない。300 ms 以内に測れたら見積もりをやめる。同時に読むのは選択と先読みを合わせて最大 3 個。取り消せない I/O は戻るまで枠に数え、保留の選択は最新の 1 個だけにする。窓を閉じても残った I/O は裏で終了を回収する。先読みで読んだが覚えなかった・読めなかったファイルは、並びに残る間は読み直さない"

