name: dco

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/test_dco.py
      - name: Every commit of the pull request is signed off
        if: github.event_name == 'pull_request'
        run: python scripts/dco.py "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
