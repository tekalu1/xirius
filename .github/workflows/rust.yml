name: rust

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ara:
    name: ARA without retries (macOS)
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - name: Repeat the clip archive test and restore regression
        run: >-
          cargo nextest run --locked -j6 -P ci --retries 0 --no-fail-fast --stress-count 24
          -p xirius-session --test ara_clips -p xirius-ara --test service
          -E 'test(=clips_play_through_the_plugin_and_its_edits_stay_with_the_song) | test(=an_edit_on_the_first_render_after_restoring_is_archived)'
