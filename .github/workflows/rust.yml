name: rust

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  PYTHONUTF8: "1"

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the only build that is made and given out (README). macOS comes back
        # here when its platform code exists.
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
      # The toolchain is the one in rust-toolchain.toml: rustup reads it and gets the same
      # version (and the components the file names) as a build on a PC (LIC-036).
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The tests that open real windows need a desktop of a known size; they are run on a PC
      # before a release (scripts/ci_tests.py has the list).
      - name: test
        run: python scripts/ci_tests.py

      # デザインの規則（docs/design-rules.md）。違反があれば落ちる。
      - name: design lint
        run: cargo run --locked -p xirius-design-lint

      # モックの CSS の数。数えるだけで落とさない（実装に移す前の残りを見る）。
      # 手元の調査資料があるときだけモックを検査する。資料は追跡・公開しない。
      - name: design lint (mock css, informational)
        if: hashFiles('temporary/research/2026-10-11/mockups/daw-main.html') != ''
        run: cargo run --locked -p xirius-design-lint -- css temporary/research/2026-10-11/mockups/daw-main.html

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  # Secrets in the history (.gitleaks.toml). The binary is gitleaks's own release (MIT), pinned
  # by version and SHA-256; gitleaks-action is not used (it asks organisations for a licence).
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          tgz="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSL --fail -o "$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" git --config .gitleaks.toml --redact --verbose --no-banner --exit-code 1 .
