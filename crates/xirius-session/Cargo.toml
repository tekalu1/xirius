[package]
name = "xirius-session"
description = "Session layer: builds the audio engine's mix from the song, keeps it in step with edits, and exports it"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-io = ["xirius-core/test-io", "xirius-prefs/test-io"]

[dependencies]
xirius-prefs = { path = "../xirius-prefs" }
xirius-core = { path = "../xirius-core" }
xirius-engine = { path = "../xirius-engine" }
xirius-params = { path = "../xirius-params" }
xirius-plugins = { path = "../xirius-plugins" }
xirius-vst3 = { path = "../xirius-vst3" }
xirius-clap = { path = "../xirius-clap" }
xirius-stretch = { path = "../xirius-stretch" }
hound = "3.5"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
flacenc = { version = "0.5", default-features = false }
ebur128 = "0.1"
# MP3 (EXP-005): LAME (LGPL) is never linked; its DLL is loaded at run time.
libloading = "0.8"
# Reads the written MP3 back, and reads the audio files a song imports (LIC-014).
symphonia = { version = "0.6", default-features = false, features = [
    "mp3",
    "id3v2",
    "wav",
    "aiff",
    "pcm",
    "flac",
    "vorbis",
    "ogg",
    "adpcm",
] }
# The one way a file's rate becomes the song's (ENG-022).
rubato = "0.16"
# The app's own update (UI-282): the ed25519 signature of the installer, checked before it runs.
ed25519-dalek = "3"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

# A rename that never writes over a file (REC-026): `renameat2` and `renamex_np`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# A test's folder under the temp folder, removed when dropped even if the test fails (ARC-028).
tempfile = "3"
claxon = "0.4"
xirius-test-vst3 = { path = "../xirius-test-vst3" }
xirius-test-clap = { path = "../xirius-test-clap" }

# Reports a test that needs LAME's library as ignored, with why, when it is not there (EXP-005).
[[test]]
name = "export_mp3"
harness = false
