[package]
name = "xirius-design-lint"
description = "Xirius のデザインの規則を、Rust のソースと CSS の上で検査する lint"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
xirius-session = { path = "../xirius-session" }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
toml = "1"

[dev-dependencies]
# A test's folder under the temp folder, removed when dropped even if the test fails (ARC-028).
tempfile = "3"
