[package]
name = "xirius-plugins"
description = "Installed plugins: scanning each bundle in its own process, the cached catalogue and saved plugin state"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "xirius-plugin-scan"
path = "src/bin/xirius-plugin-scan.rs"

[[bin]]
name = "xirius-plugin-trial"
path = "src/bin/xirius-plugin-trial.rs"

[dependencies]
xirius-core = { path = "../xirius-core" }
xirius-vst3 = { path = "../xirius-vst3" }
xirius-clap = { path = "../xirius-clap" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ErrorReporting",
    "Win32_System_JobObjects",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# A test's folder under the temp folder, removed when dropped even if the test fails (ARC-028).
tempfile = "3"
xirius-test-clap = { path = "../xirius-test-clap" }

# The version information of the programs (LIC-022, packaging/windows/version_info.rs).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# The tests read the version information back as Explorer does (LIC-022).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
