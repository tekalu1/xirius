[package]
name = "xirius-vst3"
description = "VST3 hosting on the vst3 bindings: module loading, host objects, processing and the editor window"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Bindings generated from the MIT-licensed VST3 SDK headers (coupler-rs, MIT OR Apache-2.0).
vst3 = "0.3"
rtrb = "0.4"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_Security"] }
# The fixture's resizable editor view (built as a cdylib next to the tests).
xirius-test-vst3 = { path = "../xirius-test-vst3" }
