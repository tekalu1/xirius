[package]
name = "xirius-mcp"
description = "MCP server (stdio and localhost HTTP) generated from the xirius-core command registry"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-io = ["xirius-core/test-io"]

[dependencies]
xirius-core = { path = "../xirius-core" }
serde_json = "1"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-std", "io-util", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-stream = { version = "0.1", features = ["sync"] }
getrandom = "0.4"

[dev-dependencies]
# A test's folder under the temp folder, removed when dropped even if the test fails (ARC-028).
tempfile = "3"
