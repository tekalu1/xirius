nextest-version = "0.9.151"

[profile.default]
# A test that runs longer than 60 s is shown as SLOW; one that is still running after 5 periods
# (5 minutes) is killed with its child processes and fails as TIMEOUT, by name. Custom profiles
# such as ci inherit this, so it is written once.
slow-timeout = { period = "60s", terminate-after = 5 }
archive.include = [
    { path = "debug/xirius-plugin-host.exe", relative-to = "target", on-missing = "ignore" },
    { path = "debug/xirius-plugin-host", relative-to = "target", on-missing = "ignore" },
    { path = "debug/deps/xirius_test_vst3.dll", relative-to = "target", on-missing = "ignore" },
    { path = "debug/deps/xirius_test_clap.dll", relative-to = "target", on-missing = "ignore" },
    { path = "debug/deps/libxirius_test_vst3.dylib", relative-to = "target", on-missing = "ignore" },
    { path = "debug/deps/libxirius_test_clap.dylib", relative-to = "target", on-missing = "ignore" },
]

[profile.ci]
fail-fast = false
# A test that fails and then passes is run once more and reported as flaky: ci_tests.py lists it
# in the job summary, so it is seen and not buried. One retry only; a test that fails twice fails.
retries = 1

[profile.ci.junit]
path = "junit.xml"
