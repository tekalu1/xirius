    { path = "debug/xirius-plugin-host", relative-to = "target", on-missing = "ignore" },
    { path = "debug/deps/xirius_test_vst3.dll", relative-to = "target", on-missing = "ignore" },
    { path = "debug/deps/xirius_test_clap.dll", relative-to = "target", on-missing = "ignore" },
