# cargo deny check
# 依存の許可・禁止と例外の方針は docs/licenses.md を参照。

[graph]
# 配る対象の OS だけを見る（Windows・macOS）。
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[licenses]
# docs/licenses.md の方針に基づく許可リスト。ここに無いライセンスは落とす。
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    # BSD と同じ型の許可型（表示を残せば改変・再配布できる）。GPUI が使う libbz2-rs-sys が持つ。
    "bzip2-1.0.6",
    # ファイル単位のコピーレフト。symphonia などが使う。本体は MIT のままでよい（改変したら公開）。
    "MPL-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `path` の依存（ワークスペースの中）の wildcard は許す。
allow-wildcard-paths = true

# docs/licenses.md の禁止一覧をクレート名でも検査する。
deny = [
    { name = "juce" },
    { name = "juce-sys" },
    { name = "tracktion" },
    { name = "tracktion-engine" },
    { name = "nih_plug" },
    { name = "nih_plug_derive" },
    { name = "vst3-sys" },
    { name = "rubberband" },
    { name = "rubberband-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# GPUI は crates.io の版が古く、Zed のリポジトリから取る（UI の取り込み後）。
allow-git = ["https://github.com/zed-industries/zed"]

[advisories]
version = 2
# 既知の脆弱性・メンテナンス終了の通知を見る。落とすのは脆弱性だけ。
unmaintained = "workspace"
yanked = "deny"
