[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.1.0-beta.43"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["The Xirius Authors"]
repository = "https://github.com/tekalu1/xirius"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"

[profile.dev]
debug = "line-tables-only"

# An update's installer is checked by its SHA-256. Unoptimized, hashing the test executable
# that stands in for one takes seconds. The test profile inherits this.
[profile.dev.package.sha2]
opt-level = 3

# An export measures its loudness and true peak (EXP-018). Unoptimized, measuring each stem of a
# few bars takes about a second, and the export tests write many.
[profile.dev.package.ebur128]
opt-level = 3

[profile.test]
debug = "line-tables-only"
